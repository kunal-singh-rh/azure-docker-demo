apiVersion: apps/v1
kind: Deployment

metadata:
  name: webapp-deployment
  namespace: webapp

spec:
  replicas: 2

  selector:
    matchLabels:
      app: webapp

  template:
    metadata:
      labels:
        app: webapp

    spec:
      containers:
      - name: webapp

        image: kunaldemocicd.azurecr.io/webapp:latest

        ports:
        - containerPort: 80

        resources:
          requests:
            cpu: 100m
            memory: 64Mi

          limits:
            cpu: 500m
            memory: 256Mi
