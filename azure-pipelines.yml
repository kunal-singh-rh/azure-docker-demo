
trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  imageRepository: webapp
  dockerRegistryServiceConnection: acr-sc
  azureServiceConnection: azure-aks-sc

  dockerfilePath: Dockerfile
  tag: latest

  azureResourceGroup: rg-cicd-demo
  aksClusterName: aks-cicd-demo
  kubernetesNamespace: webapp

steps:

# Step 1: Checkout GitHub Code
- checkout: self


# Step 2: Build and Push Docker Image to ACR
- task: Docker@2
  displayName: Build and Push Image to ACR
  inputs:
    command: buildAndPush
    containerRegistry: $(dockerRegistryServiceConnection)
    repository: $(imageRepository)
    Dockerfile: $(dockerfilePath)
    tags: |
      $(tag)
      $(Build.BuildId)


# Step 3: Deploy Application on AKS
- task: KubernetesManifest@1
  displayName: Deploy Application to AKS

  inputs:
    action: deploy

    connectionType: azureResourceManager

    azureSubscriptionConnection: $(azureServiceConnection)

    azureResourceGroup: $(azureResourceGroup)

    kubernetesCluster: $(aksClusterName)

    useClusterAdmin: false

    namespace: $(kubernetesNamespace)

    manifests: |
      $(Build.SourcesDirectory)/k8s/deployment.yaml
      $(Build.SourcesDirectory)/k8s/service.yaml

    containers: |
      kunaldemocicd.azurecr.io/webapp:$(Build.BuildId)

    rolloutStatusTimeout: 180
